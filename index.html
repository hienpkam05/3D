<!doctype html>
<html lang="vi">
  <head>
    <title>3D Scene Editor</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- MapLibre GL -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.css" />
    <!-- Editor CSS -->
    <link rel="stylesheet" href="./css/editor.css" />

    <!-- Non-module JS libs -->
    <script src="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="editor-layout">
        <!-- Left: Library Panel -->
        <div class="editor-sidebar">
          <library-panel
            :items="libraryItems"
            :active-id="placingItem?.id"
            @select="startPlacement"
          ></library-panel>
        </div>

        <!-- Center: Map + Toolbar -->
        <div class="editor-main">
          <editor-toolbar
            :placement-mode="placementMode"
            :has-selection="canDelete"
            :placing-name="placingItem?.name || ''"
            @save="saveConfig"
            @add-building="showBuildingPicker = true"
            @delete="deleteDeco()"
            @cancel-place="cancelPlacement"
          ></editor-toolbar>

          <div id="map"></div>

          <div v-if="showBuildingPicker" class="building-picker shadow">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <strong class="small">Thêm công trình</strong>
              <button class="btn-close btn-close-sm" @click="showBuildingPicker = false"></button>
            </div>
            <p class="text-muted small mb-2">Chọn model, sau đó click lên map để đặt.</p>
            <button v-for="item in nearbyBuildings" :key="item.id"
                    class="btn btn-outline-primary btn-sm w-100 text-start mb-1"
                    @click="startPlacement(item)">
              {{ item.name }}
            </button>
          </div>

          <div v-if="placementMode" class="editor-status">
            <span class="badge bg-warning text-dark shadow-sm">
              Click vào bản đồ để đặt model
            </span>
          </div>
          <div v-if="isDragging" class="editor-status">
            <span class="badge bg-info text-white shadow-sm">
              Đang di chuyển...
            </span>
          </div>
        </div>

        <!-- Right: Properties Panel -->
        <div class="editor-right">
          <properties-panel
            :decoration="selectedDeco"
            :decorations="decorations"
            :selected-id="selectedDecoId"
            @update="handlePropertyUpdate"
            @select-deco="selectDecoById"
            @delete="deleteDeco"
          ></properties-panel>
        </div>
      </div>
    </div>

    <!-- Import map -->
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js",
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>

    <!-- Vue app entry -->
    <script type="module" src="./js/app1.js"></script>
  </body>
</html>
